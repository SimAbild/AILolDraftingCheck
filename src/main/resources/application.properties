server.error.include-stacktrace=never
server.error.include-message=always

# ChatGPT settings. Set your API_KEY environment variable before running.
app.api-key=${API_KEY}
app.url=https://api.openai.com/v1/chat/completions
app.model=gpt-4o-mini
app.temperature=0.7
app.max_tokens=900
app.frequency_penalty=0.0
app.presence_penalty=0.0
app.top_p=1.0
