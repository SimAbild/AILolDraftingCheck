spring.application.name=AILolDraftingCheck

# H2 in-memory database (console at /h2-console)
spring.datasource.url=jdbc:h2:mem:draftdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

server.error.include-stacktrace=never
server.error.include-message=always

# OpenAI / ChatGPT settings (set API_KEY env var before running)
app.api-key=${API_KEY}
app.url=https://api.openai.com/v1/chat/completions
app.model=gpt-4o-mini
app.temperature=0.7
app.max_tokens=900
app.frequency_penalty=0.0
app.presence_penalty=0.0
app.top_p=1.0

# IP-rate limits (3 requests, refilled every 2 minutes)
app.bucket_capacity=3
app.refill_amount=3
app.refill_time=2

# Riot Data Dragon - patch version is auto-detected at startup, this is the fallback
app.datadragon.fallback-version=14.7.1

# OP.GG scraper toggle (false = always use LLM-only reasoning)
app.opgg.scrape-enabled=true
app.opgg.cache-ttl-hours=24
